name: Validate museum builder
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/secret-scan.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Check pointer-lock inputs first so a browser regression fails promptly.
      - run: npm run test:e2e -- --grep 'WASD moves'
      - run: npm run test:e2e -- --grep-invert 'WASD moves'
      - run: npm run test:production
      - run: npm run worker:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
